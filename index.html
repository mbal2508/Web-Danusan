<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta CSP yang ditambahkan sesuai permintaan Anda dan disesuaikan untuk Firebase -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;">
    
    <title>FlowGuard - Worktime & Tracker</title>
    
    <link rel="icon" href="FlowGuard Logo's.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-app: #11111b; --bg-card: #181825; --bg-frame: #1e1e2e; --bg-input: #313244; --border-color: rgba(255,255,255,0.08); --fg-text: #cdd6f4; --subtext: #9399b2; --overlay: rgba(17,17,27,0.85); --btn-blue: #89b4fa; --btn-green: #a6e3a1; --btn-red: #f38ba8; --accent-yellow: #f9e2af; --disabled-bg: #45475a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-app); color: var(--fg-text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; background-image: radial-gradient(circle at 50% 0%, rgba(137,180,250,0.05), transparent 70%); }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo-img { height: 42px; filter: drop-shadow(0 4px 12px rgba(137,180,250,0.25)); }
        .header h1 { font-size: 24px; font-weight: 700; color: var(--fg-text); }
        .auth-status { display: flex; align-items: center; gap: 10px; }
        
        .btn, .btn-auth, .modal-btn { border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-auth { background: var(--bg-frame); border: 1px solid var(--border-color); color: var(--fg-text); padding: 6px 12px; font-size: 12px; }
        .btn-auth:hover { border-color: var(--btn-blue); color: var(--btn-blue); }
        
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; position: relative; }
        .card-title { position: absolute; top: -11px; left: 14px; background: var(--bg-app); padding: 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--subtext); border-radius: 4px; }
        
        .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
        .btn { padding: 12px 14px; font-size: 13px; color: #11111b; border-radius: 10px; }
        .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
        .btn:disabled { background: var(--disabled-bg) !important; color: var(--subtext) !important; cursor: not-allowed; opacity: 0.6; }
        .btn-blue { background: var(--btn-blue); } .btn-red { background: var(--btn-red); } .btn-green { background: var(--btn-green); }
        .btn-stop { background: var(--btn-red); width: 100%; margin-top: 10px; display: none; }
        
        .custom-form { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--subtext); }
        
        .input-field, .textarea-field { background: var(--bg-frame); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; color: var(--fg-text); font-size: 13px; outline: none; width: 100%; }
        .input-field:focus, .textarea-field:focus { border-color: var(--btn-blue); }
        .textarea-field { resize: vertical; min-height: 60px; }
        
        .input-group { display: flex; align-items: center; background: var(--bg-frame); border: 1px solid var(--border-color); border-radius: 8px; padding-right: 12px; transition: 0.2s; }
        .input-group:focus-within { border-color: var(--btn-blue); }
        .input-group .input-field { border: none; border-radius: 8px 0 0 8px; flex: 1; }
        .input-group span { color: var(--subtext); font-size: 12px; font-weight: 500; }
        
        .status-frame { background: var(--bg-frame); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; }
        .status-header { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--subtext); margin-bottom: 8px; }
        .pulse-dot { width: 8px; height: 8px; background: var(--subtext); border-radius: 50%; }
        .pulse-dot.active { background: var(--btn-green); box-shadow: 0 0 8px var(--btn-green); }
        .label-status { font-size: 13px; white-space: pre-line; line-height: 1.5; font-weight: 500; }
        
        .sys-logs { width: 100%; display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
        .sys-log { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
        .sys-log.green { color: var(--btn-green); } .sys-log.yellow { color: var(--accent-yellow); }
        .timer-badge { background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); padding: 6px 16px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--btn-blue); display: none; }
        
        .logs-container { display: flex; flex-direction: column; gap: 10px; max-height: 240px; overflow-y: auto; margin-top: 6px; }
        .log-item { background: var(--bg-frame); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; font-size: 12px; }
        .log-header { display: flex; justify-content: space-between; color: var(--subtext); font-size: 11px; margin-bottom: 6px; }
        .log-duration { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--btn-blue); }
        .badge-cloud { background: rgba(166,227,161,0.2); color: var(--btn-green); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .badge-local { background: rgba(249,226,175,0.2); color: var(--accent-yellow); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase;}
        .log-doc { color: var(--btn-green); font-size: 11px; text-decoration: none; word-break: break-all; display: block; margin-top: 4px;}
        
        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--overlay); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.2s; padding: 16px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; width: 100%; max-width: 340px; text-align: center; transform: scale(0.95); transition: 0.2s; }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--btn-blue); }
        .modal-body { font-size: 13px; color: var(--fg-text); margin-bottom: 18px; line-height: 1.5; white-space: pre-wrap; text-align: left;}
        .modal-actions { display: flex; gap: 8px; justify-content: center; }
        .modal-btn { flex: 1; padding: 10px; font-size: 13px; }
        .modal-btn-primary { background: var(--btn-blue); color: #11111b; }
        .modal-btn-green { background: var(--btn-green); color: #11111b; }
        .modal-btn-secondary { background: var(--bg-input); color: var(--fg-text); }
        .footer { text-align: center; font-size: 11px; color: var(--subtext); opacity: 0.7; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-brand">
                <img src="FlowGuard Logo's.png" alt="Logo" class="header-logo-img" onerror="this.style.display='none'">
                <h1>FlowGuard</h1>
            </div>
            <div class="auth-status" id="auth-container">
                <!-- Diisi via JS -->
            </div>
        </div>

        <div class="card">
            <div class="card-title">Quick Mode</div>
            <div class="preset-grid">
                <button id="btn-preset-1" class="btn btn-blue">1 Hr Work, 30 Min Break</button>
                <button id="btn-preset-2" class="btn btn-red">Work Without Break</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Custom Mode</div>
            <div class="custom-form">
                <div class="form-row">
                    <div class="form-group"><label>Work Hours</label><input type="number" id="custom-hour" class="input-field" placeholder="1.5" step="0.1"></div>
                    <div class="form-group"><label>Break (Hours)</label><input type="number" id="custom-break" class="input-field" placeholder="0.5" step="0.1"></div>
                </div>
                <button id="btn-custom" class="btn btn-green">Start Custom Mode</button>
            </div>
        </div>

        <div class="status-frame">
            <div class="status-header"><div id="pulse-dot" class="pulse-dot"></div><span>System Status</span></div>
            <div id="label-status" class="label-status">Status program akan muncul di sini...</div>
            <div class="sys-logs"><div id="label-sys" class="sys-log green"></div><div id="label-back" class="sys-log yellow"></div></div>
            <div id="timer-badge" class="timer-badge">Sisa Waktu: <span id="time-left">00:00:00</span></div>
            <button id="btn-stop-work" class="btn btn-stop">Stop Working & Save Log</button>
        </div>

        <div class="card">
            <div class="card-title">Riwayat Kerja</div>
            <div class="logs-container" id="logs-container"></div>
        </div>

        <div class="footer">© 2026 Jembar Muhammad Firdiana.</div>
    </div>

    <!-- Modal Khusus Auth -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">Identitas Akun</div>
            <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:18px;">
                <div class="form-group">
                    <label>Nama Akun (Tanpa Spasi)</label>
                    <div class="input-group">
                        <input type="text" id="auth-username" class="input-field" placeholder="contoh: jembar">
                        <span>@gmail.com</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" class="input-field" placeholder="Minimal 6 karakter">
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-auth-login" class="modal-btn modal-btn-primary">Masuk</button>
                <button id="btn-auth-register" class="modal-btn modal-btn-secondary">Daftar</button>
            </div>
            <div style="margin-top:12px;"><button id="btn-auth-close" style="background:none; border:none; color:var(--subtext); font-size:12px; cursor:pointer;">Batal</button></div>
        </div>
    </div>

    <!-- Modal Standar Sistem -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">FlowGuard</div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDa1BQzIYtMu5kDmWZyd-DiludUqrmQZC0",
            authDomain: "flowguard-web.firebaseapp.com",
            projectId: "flowguard-web",
            storageBucket: "flowguard-web.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, isRunning = false, countdownInterval = null, alarmInterval = null, workStartTime = null, audioCtx = null;

        const ui = {
            authContainer: document.getElementById('auth-container'),
            preset1: document.getElementById('btn-preset-1'), preset2: document.getElementById('btn-preset-2'),
            customBtn: document.getElementById('btn-custom'), stopBtn: document.getElementById('btn-stop-work'),
            hourInput: document.getElementById('custom-hour'), breakInput: document.getElementById('custom-break'),
            lblStatus: document.getElementById('label-status'), lblSys: document.getElementById('label-sys'),
            lblBack: document.getElementById('label-back'), timerBadge: document.getElementById('timer-badge'),
            timeLeft: document.getElementById('time-left'), pulse: document.getElementById('pulse-dot'),
            logs: document.getElementById('logs-container'),
            authModal: document.getElementById('auth-modal'), authUsername: document.getElementById('auth-username'), authPass: document.getElementById('auth-password')
        };

        // --- SISTEM BACA LOG ANTI CRASH ---
        const getLocalLogs = () => {
            try {
                const data = localStorage.getItem('flowguard_logs');
                if (!data) return [];
                const parsedData = JSON.parse(data);
                return Array.isArray(parsedData) ? parsedData : [];
            } catch (error) {
                console.warn("Format data lokal versi lama terdeteksi, membersihkan data yang error agar web tidak crash...");
                localStorage.removeItem('flowguard_logs');
                return [];
            }
        };

        function toggleAuthModal(show) {
            ui.authUsername.value = ''; ui.authPass.value = '';
            show ? ui.authModal.classList.add('active') : ui.authModal.classList.remove('active');
        }

        document.getElementById('btn-auth-close').onclick = () => toggleAuthModal(false);

        document.getElementById('btn-auth-login').onclick = async () => {
            const user = ui.authUsername.value.trim().replace(/\s/g, '');
            const pass = ui.authPass.value;
            if(!user || !pass) return alert("Harap isi Nama Akun dan Password!");
            
            try {
                ui.lblStatus.textContent = "Sedang login...";
                await signInWithEmailAndPassword(auth, `${user}@gmail.com`, pass);
                toggleAuthModal(false);
                ui.lblStatus.textContent = "Login berhasil!";
            } catch(e) {
                alert("Gagal masuk. Periksa kembali akun atau password Anda.");
                ui.lblStatus.textContent = "Gagal login.";
            }
        };

        document.getElementById('btn-auth-register').onclick = async () => {
            const user = ui.authUsername.value.trim().replace(/\s/g, '');
            const pass = ui.authPass.value;
            if(!user || pass.length < 6) return alert("Nama akun wajib diisi & password minimal 6 karakter!");
            
            try {
                await createUserWithEmailAndPassword(auth, `${user}@gmail.com`, pass);
                toggleAuthModal(false);
                alert("Akun berhasil didaftarkan dan Anda sudah masuk!");
            } catch(e) {
                if(e.code === 'auth/email-already-in-use') alert("Nama akun ini sudah dipakai, silakan gunakan yang lain atau klik Masuk.");
                else alert("Gagal daftar: " + e.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                const displayName = user.email.split('@')[0];
                ui.authContainer.innerHTML = `<span style="font-size:13px; font-weight:700; color:var(--btn-blue);">Hi, ${displayName}</span><button class="btn-auth" id="btn-logout">Logout</button>`;
                document.getElementById('btn-logout').onclick = () => { initAudio(); signOut(auth); };
                await syncLocalLogsToCloud();
            } else {
                ui.authContainer.innerHTML = `<button class="btn-auth" id="btn-login-trigger">Masuk / Daftar</button>`;
                document.getElementById('btn-login-trigger').onclick = () => { initAudio(); toggleAuthModal(true); };
            }
            renderLogs();
        });

        function initAudio() {
            if (!audioCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; if (AudioContext) audioCtx = new AudioContext(); }
            if (audioCtx?.state === 'suspended') audioCtx.resume();
        }

        function playMelody() {
            if (!audioCtx) return;
            const playNote = (f, s, d) => {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(f, audioCtx.currentTime + s);
                g.gain.setValueAtTime(0.25, audioCtx.currentTime + s); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + s + d);
                o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + s); o.stop(audioCtx.currentTime + s + d);
            };
            playNote(523.25, 0, 0.25); playNote(659.25, 0.15, 0.25); playNote(783.99, 0.3, 0.4);
        }

        function formatSec(s) { return `${Math.floor(s/3600).toString().padStart(2,'0')}:${Math.floor((s%3600)/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }

        function showCustomModal(title, text, btns) {
            return new Promise((res) => {
                initAudio(); if(alarmInterval) clearInterval(alarmInterval); playMelody(); alarmInterval = setInterval(playMelody, 1500);
                const overlay = document.getElementById('custom-modal');
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-body').innerHTML = text;
                const acts = document.getElementById('modal-actions'); acts.innerHTML = '';
                btns.forEach(b => {
                    const btn = document.createElement('button'); btn.className = `modal-btn ${b.class}`; btn.textContent = b.text;
                    btn.onclick = () => { if(alarmInterval) clearInterval(alarmInterval); overlay.classList.remove('active'); res(b.value ? b.value() : true); };
                    acts.appendChild(btn);
                });
                overlay.classList.add('active');
            });
        }
        
        const showAlert = (text, title = "FlowGuard") => showCustomModal(title, text, [{ text: 'OK', value: ()=>true, class: 'modal-btn-primary' }]);

        function setUILock(locked) {
            ui.preset1.disabled = locked; ui.preset2.disabled = locked; ui.customBtn.disabled = locked;
            ui.hourInput.disabled = locked; ui.breakInput.disabled = locked;
            locked ? (ui.pulse.classList.add('active'), ui.stopBtn.style.display = 'block') : (ui.pulse.classList.remove('active'), ui.stopBtn.style.display = 'none', ui.timerBadge.style.display = 'none');
        }

        function startCountdown(sec) {
            return new Promise((res) => {
                let r = sec; ui.timerBadge.style.display = 'block'; ui.timeLeft.textContent = formatSec(r);
                if (countdownInterval) clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    if (!isRunning) return clearInterval(countdownInterval), ui.timerBadge.style.display = 'none', res();
                    r--; ui.timeLeft.textContent = formatSec(r);
                    if (r <= 0) { clearInterval(countdownInterval); ui.timerBadge.style.display = 'none'; res(); }
                }, 1000);
            });
        }
        
        async function syncLocalLogsToCloud() {
            if (!currentUser) return;
            const locals = getLocalLogs(); if (!locals.length) return;
            for (const log of locals) {
                try { await addDoc(collection(db, "work_logs"), { userId: currentUser.uid, durationFormatted: log.durationFormatted || "00:00", secondsWorked: log.secondsWorked || 0, taskDescription: log.taskDescription || "Lokal", docLink: log.docLink || "", createdAt: new Date(log.timestamp || Date.now()) }); } catch(e){}
            }
            localStorage.removeItem('flowguard_logs');
        }

        async function renderLogs() {
            ui.logs.innerHTML = ''; let logs = [];
            if (currentUser) {
                try {
                    const q = query(collection(db, "work_logs"), where("userId", "==", currentUser.uid), orderBy("createdAt", "desc"));
                    const snap = await getDocs(q);
                    snap.forEach(doc => {
                        const data = doc.data();
                        const dateStr = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('id-ID') : new Date().toLocaleString('id-ID');
                        logs.push({...data, isCloud: true, dateStr});
                    });
                } catch(e){ console.error("Error get cloud logs:", e); }
            } else { 
                logs = getLocalLogs().map(l => ({...l, isCloud: false, dateStr: new Date(l.timestamp || Date.now()).toLocaleString('id-ID')})); 
            }
            
            if (!logs.length) return ui.logs.innerHTML = `<div style="text-align:center; color:var(--subtext); font-size:12px; padding:12px;">Belum ada riwayat kerja.</div>`;
            
            logs.forEach(l => {
                const doc = l.docLink ? `<a href="${l.docLink.startsWith('http') ? l.docLink : 'https://'+l.docLink}" target="_blank" class="log-doc">Link Dokumen</a>` : '';
                ui.logs.innerHTML += `
                    <div class="log-item">
                        <div class="log-header"><span>${l.dateStr}</span><div style="display:flex;gap:6px;align-items:center"><span class="log-duration">${l.durationFormatted || '00:00:00'}</span><span class="badge-cloud ${l.isCloud?'':'badge-local'}">${l.isCloud?'Cloud':'Lokal'}</span></div></div>
                        <div style="font-weight:600;color:var(--fg-text);">${l.taskDescription || 'Tanpa deskripsi'}</div>${doc}
                    </div>`;
            });
        }

        ui.stopBtn.onclick = async () => {
            initAudio(); isRunning = false; if(countdownInterval) clearInterval(countdownInterval); if(alarmInterval) clearInterval(alarmInterval);
            const sec = workStartTime ? Math.max(0, Math.floor((Date.now() - workStartTime)/1000)) : 0;
            const form = `<div style="display:flex;flex-direction:column;gap:10px;"><div><strong>Durasi Kerja:</strong> ${formatSec(sec)}</div>
                <div class="form-group"><label>Apa yang dikerjakan?</label><textarea id="m-task" class="textarea-field"></textarea></div>
                <div class="form-group"><label>Link Dokumen (Opsional)</label><input type="url" id="m-doc" class="input-field"></div></div>`;
            
            await showCustomModal("Simpan Riwayat", form, [
                { text: 'Simpan', class: 'modal-btn-green', value: async () => {
                    const d = { userId: currentUser?.uid, durationFormatted: formatSec(sec), secondsWorked: sec, taskDescription: document.getElementById('m-task').value.trim(), docLink: document.getElementById('m-doc').value.trim() };
                    if(currentUser) { d.createdAt = serverTimestamp(); await addDoc(collection(db, "work_logs"), d); }
                    else { d.timestamp = new Date().toISOString(); const ls = getLocalLogs(); ls.unshift(d); localStorage.setItem('flowguard_logs', JSON.stringify(ls)); }
                    renderLogs();
                }},
                { text: 'Buang', class: 'modal-btn-secondary', value: ()=>false }
            ]);
            ui.lblStatus.textContent = "Sesi dihentikan."; ui.lblSys.textContent = ""; ui.lblBack.textContent = ""; setUILock(false);
        };

        async function processSession(w, b, bTxt) {
            let hour = 1;
            while(isRunning) {
                ui.lblStatus.textContent = `===== Information =====\nHour #${hour} | Started: ${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}\n=====================`;
                if(new Date().getHours() < 5) if(await showCustomModal("Warning", "Past midnight. Sleep?", [{text:'OK (Shutdown)', value:()=>'Y', class:'modal-btn-primary'}, {text:'No', value:()=>'N', class:'modal-btn-secondary'}]) === 'Y') return (isRunning = false, setUILock(false));
                
                await startCountdown(w); if(!isRunning) break;
                await showAlert(w >= 3600 ? "One hour has passed..." : "Work time has passed..."); if(!isRunning) break;
                
                while(isRunning) {
                    if(await showCustomModal("Hydration", "Have you drank water?", [{text:'Yes', value:()=>'Y', class:'modal-btn-green'},{text:'Not yet', value:()=>'N', class:'modal-btn-secondary'}]) === 'Y') {
                        ui.lblSys.textContent = "SYSTEM : Good, hydrated."; ui.lblSys.className = "sys-log green"; break;
                    }
                    await showAlert("I will wait 5 minutes."); if(!isRunning) break; await startCountdown(300);
                }
                if(!isRunning) break;

                if(b > 0) {
                    await showAlert(`Time to break for ${bTxt}..`); if(!isRunning) break;
                    ui.lblSys.textContent = `SYSTEM : Resting ${bTxt}..`; ui.lblSys.className = "sys-log yellow";
                    const ret = new Date(Date.now() + b*1000);
                    ui.lblBack.textContent = `SYSTEM : Back at ${ret.getHours().toString().padStart(2,'0')}:${ret.getMinutes().toString().padStart(2,'0')}`;
                    await startCountdown(b); if(!isRunning) break;
                    await showAlert("Break is over, back to work boss!"); ui.lblBack.textContent = "";
                }
                ui.lblSys.textContent = "SYSTEM : Back to work boss!"; ui.lblSys.className = "sys-log green"; hour++;
            }
        }

        const run = (w, b, txt) => { initAudio(); isRunning = true; workStartTime = Date.now(); setUILock(true); processSession(w, b, txt); };
        ui.preset1.onclick = () => run(3600, 1800, "30 minutes");
        ui.preset2.onclick = () => run(3600, 0, "0 minutes");
        ui.customBtn.onclick = () => {
            const h = parseFloat(ui.hourInput.value), b = parseFloat(ui.breakInput.value || 0);
            if(!h || h<=0 || h>24 || b<0 || b>24) return showAlert("Input tidak valid. Max 24 jam.");
            run(Math.round(h*3600), Math.round(b*3600), b>=1 ? `${b} jam` : `${b*60} menit`);
        };

        renderLogs();
    </script>
</body>
</html>
